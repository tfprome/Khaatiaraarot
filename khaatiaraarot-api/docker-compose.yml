services:
  postgres:
    image: postgres:16
    container_name: kha-postgres
    restart: unless-stopped
    shm_size: '128mb'
    environment:
      POSTGRES_USER: kha
      POSTGRES_PASSWORD: kha
      POSTGRES_DB: khaatiaraarot
      POSTGRES_INITDB_ARGS: "-c dynamic_shared_memory_type=mmap"
    ports:
      - "5434:5432"
    volumes:
      - kha_postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/0000_previous_union_jack.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kha -d khaatiaraarot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: kha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kha_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kha_postgres_data:
  kha_redis_data:
